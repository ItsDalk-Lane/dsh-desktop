name: build-engines

# M3:按平台预构建 dsh 引擎包并发布到 GitHub Release(tag: engines)。
# 发布源地址(配到房子的 releaseIndexUrl):
#   https://github.com/<owner>/<repo>/releases/download/engines/release-index.json
#
# 触发方式:
#   1. 手动(workflow_dispatch,可指定版本,留空 = 最新)
#   2. 每天 UTC 21:00(北京时间 05:00)自动检查上游新版本,有新版才构建
# 版本没变时 resolve 作业输出 changed=false,后续作业直接跳过,不浪费配额。

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要构建的 @deepseek-ai/dsh 版本,留空 = 最新'
        required: false
        default: ''
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.dsh_version }}
        run: |
          VERSION="$WANT"
          [ -z "$VERSION" ] && VERSION=$(npm view @deepseek-ai/dsh version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "目标版本: $VERSION"
          rm -f release-index.json
          gh release download engines -p release-index.json 2>/dev/null || true
          if [ -f release-index.json ] && node -e "
            const idx = require('./release-index.json');
            process.exit(idx.engines.some((e) => e.id === 'dsh' && e.version === process.argv[1]) ? 0 : 1);
          " "$VERSION"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "该版本已发布过,跳过构建"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # darwin-x64 用 Intel runner;GitHub 退役 Intel 阵容后按官方公告换标签
        include:
          - { os: macos-15, key: darwin-arm64 }
          - { os: macos-15-intel, key: darwin-x64 }
          - { os: windows-latest, key: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble engine (${{ matrix.key }})
        run: node scripts/make-dsh-engine.js "${{ needs.resolve.outputs.version }}" --out engine

      # dsh 含平台原生模块,install 在哪个平台跑,产物就只能给哪个平台 —— 矩阵的意义所在
      - name: Pack
        shell: bash
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/engines
        run: |
          node scripts/pack-engine.js engine --out dist --base-url "$BASE_URL"
          mv dist/release-index.json "dist/fragment-${{ matrix.key }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.key }}
          path: |
            dist/*.tgz
            dist/fragment-*.json

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Merge release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view engines >/dev/null 2>&1 || gh release create engines \
            --title "DSH engine packages" --notes "CI 自动发布的引擎包(darwin-arm64 / darwin-x64 / win32-x64)"
          gh release download engines -p release-index.json -O old-index.json 2>/dev/null \
            || echo '{"engines":[]}' > old-index.json
          node scripts/merge-release-index.js -o dist/release-index.json old-index.json dist/fragment-*.json
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload engines dist/*.tgz dist/release-index.json --clobber
