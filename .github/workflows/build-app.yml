name: build-app

# DSH Desktop 安装包(macOS DMG/ZIP / Windows NSIS exe)。
# 架构:pnpm monorepo —— 引擎(deepseek-harness 源码吸收版)+ studio 桌面壳一起构建,
# 引擎产物随安装包分发(resourcesPath/host),不再有外置引擎包。
# 触发:手动,或推送 app-v* tag(安装包挂到同名 Release,latest*.yml 供 electron-updater)。
#
# mac 在单个作业里同时构建 arm64+x64:latest-mac.yml 自动合并双架构
# (electron-updater 靠它选对包),拆两个作业会产生两份冲突的同名 yml。
# 无签名证书:mac 走完整 ad-hoc 签名(identity: '-')。
# 不要在 CI 里禁用签名自动发现 —— 那会连 ad-hoc 都跳过,包会被 Gatekeeper 死拦。

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, artifact: app-macos }
          - { os: windows-latest, artifact: app-win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (packageManager 钉住 11.7.0)
        run: corepack enable
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build monorepo + package desktop app
        run: corepack pnpm --filter @deepseek-ai/dsh-desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist-exe/*.dmg
            apps/desktop/dist-exe/*.exe
            apps/desktop/dist-exe/*.zip
            apps/desktop/dist-exe/*.yml
            apps/desktop/dist-exe/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Create release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # -R 必须带:本作业没有 checkout,不带 -R 时 gh 会去找 git 仓库而失败
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "DSH Desktop $TAG" \
            --notes "DSH Desktop 安装包(引擎随包分发;mac 为 ad-hoc 签名)。自动更新元数据(latest*.yml)已一并发布。" \
            release-dist/*.dmg release-dist/*.exe release-dist/*.zip release-dist/*.yml release-dist/*.blockmap
