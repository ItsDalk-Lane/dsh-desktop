name: build-app

# 打"房子"本身的安装包(macOS DMG / Windows NSIS exe)。
# 触发:手动,或推送 app-v* 形式的 tag(打 tag 时会额外把安装包挂到同名 Release)。
# 注意:这是壳的安装包,不是引擎包(引擎包走 build-engines.yml)。
# 目前无签名证书,产出的是未签名包:macOS 首次打开需右键→打开,Windows 会有 SmartScreen 提示。
#
# mac 在单个作业里同时构建 arm64+x64:latest-mac.yml 会自动合并双架构
# (electron-updater 靠它选对包),拆两个作业会产生两份冲突的同名 yml。

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, args: '--mac --arm64 --x64', artifact: app-macos }
          - { os: windows-latest, args: '--win --x64', artifact: app-win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 没有签名证书,禁用自动发现,打未签名包
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Create release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # -R 必须带:本作业没有 checkout,不带 -R 时 gh 会去找 git 仓库而失败
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "DSH Desktop $TAG" \
            --notes "桌面 App 安装包(未签名)。自动更新元数据(latest*.yml)已一并发布。" \
            release-dist/*.dmg release-dist/*.exe release-dist/*.zip release-dist/*.yml release-dist/*.blockmap
