<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    background: #0b0e14;
    color: #e6e9ef;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    -webkit-app-region: drag;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4d6bfe, #7a5cfe);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  .status { font-size: 13px; color: #9aa3b5; min-height: 18px; text-align: center; padding: 0 24px; }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid #262c3a;
    border-top-color: #4d6bfe;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="logo">DSH</div>
  <h1>DSH Desktop</h1>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">正在准备…</div>
<script>
  const statusEl = document.getElementById('status');
  const spinner = document.getElementById('spinner');

  function render(s) {
    if (!s) return;
    const engine = s.engine ? `${s.engine.name} @ ${s.engine.version}` : '';
    switch (s.state) {
      case 'resolving': statusEl.textContent = '正在定位引擎…'; break;
      case 'starting': statusEl.textContent = `正在启动引擎 ${engine}…`; break;
      case 'ready': statusEl.textContent = '引擎就绪,正在打开界面…'; break;
      case 'stopping': statusEl.textContent = '正在停止引擎…'; break;
      case 'failed': statusEl.textContent = s.error || '启动失败'; break;
      default: statusEl.textContent = '正在准备…';
    }
    spinner.classList.toggle('hidden', s.state === 'failed');
  }

  window.dshDesktop.onStatus(render);
  window.dshDesktop.getStatus().then(render);
</script>
</body>
</html>
