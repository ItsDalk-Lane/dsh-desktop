<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启动失败</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    background: #0b0e14;
    color: #e6e9ef;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px;
  }
  .icon { font-size: 34px; }
  h1 { font-size: 17px; font-weight: 600; }
  .error {
    width: 100%;
    max-width: 460px;
    background: #141926;
    border: 1px solid #232b3d;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: #ff9a9a;
    font-family: ui-monospace, Menlo, monospace;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .row { display: flex; gap: 10px; margin-top: 8px; }
  button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid #2a3245;
    background: #1a2130;
    color: #e6e9ef;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #232c40; }
  button.primary { background: #4d6bfe; border-color: #4d6bfe; }
  button.primary:hover { background: #3f5cf5; }
  .hint { font-size: 12px; color: #7a8499; margin-top: 10px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1>引擎启动失败</h1>
  <div class="error" id="error">读取状态中…</div>
  <div class="row">
    <button class="primary" id="retry">重试</button>
    <button id="logs">打开日志</button>
    <button id="quit">退出</button>
  </div>
  <div class="hint" id="hint">
    开发模式下可直接使用内置 mock 引擎验证链路;正式引擎请用 import-engine 脚本导入。
  </div>
<script>
  const errorEl = document.getElementById('error');

  window.dshDesktop.getStatus().then((s) => {
    errorEl.textContent = s.error || '未知错误';
    if (!s.packaged) {
      const btn = document.createElement('button');
      btn.textContent = '使用内置 Mock 引擎';
      btn.id = 'mock';
      btn.className = 'primary';
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = '导入中…';
        await window.dshDesktop.useMockEngine();
        await window.dshDesktop.retry();
      };
      document.querySelector('.row').appendChild(btn);
      document.getElementById('retry').classList.remove('primary');
    }
  });
  window.dshDesktop.onStatus((s) => {
    if (s.error) errorEl.textContent = s.error;
  });

  document.getElementById('retry').onclick = () => window.dshDesktop.retry();
  document.getElementById('logs').onclick = () => window.dshDesktop.openLogs();
  document.getElementById('quit').onclick = () => window.dshDesktop.quit();
</script>
</body>
</html>
