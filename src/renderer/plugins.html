<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    background: #0b0e14;
    color: #e6e9ef;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 22px 12px;
    border-bottom: 1px solid #1a2130;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .engine { font-size: 12px; color: #7a8499; margin-left: auto; }
  .searchbar { display: flex; gap: 8px; padding: 14px 22px 10px; flex-shrink: 0; }
  .searchbar input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #2a3245;
    background: #141926;
    color: #e6e9ef;
    font-size: 13px;
    outline: none;
  }
  .searchbar input:focus { border-color: #4d6bfe; }
  .searchbar button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid #4d6bfe;
    background: #4d6bfe;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .searchbar button:hover { background: #3f5cf5; }
  .searchbar button:disabled { opacity: 0.5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 4px 22px 20px; }
  h2 {
    font-size: 12px;
    font-weight: 600;
    color: #9aa4bb;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 14px 0 8px;
  }
  .card {
    background: #141926;
    border: 1px solid #232b3d;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .title { font-size: 13.5px; font-weight: 600; }
  .card .title .ver { color: #7a8499; font-weight: 400; font-size: 12px; margin-left: 6px; }
  .card .desc {
    font-size: 12px;
    color: #9aa4bb;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .meta { font-size: 11px; color: #5c6579; margin-top: 3px; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid #2e4a3a;
    color: #7fd4a8;
    background: #12271c;
    white-space: nowrap;
  }
  .badge.off { border-color: #46402a; color: #d4b67f; background: #292314; }
  button.act {
    padding: 6px 14px;
    border-radius: 7px;
    border: 1px solid #2a3245;
    background: #1a2130;
    color: #e6e9ef;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.act:hover { background: #232c40; }
  button.act.primary { background: #4d6bfe; border-color: #4d6bfe; color: #fff; }
  button.act.primary:hover { background: #3f5cf5; }
  button.act.danger:hover { border-color: #6b3f46; color: #ff9a9a; }
  button.act:disabled { opacity: 0.4; cursor: default; }
  .empty { color: #7a8499; font-size: 12.5px; padding: 18px 4px; line-height: 1.8; }
  .notice {
    margin: 14px 22px 0;
    background: #141926;
    border: 1px solid #232b3d;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: #9aa4bb;
    line-height: 1.7;
  }
  footer {
    flex-shrink: 0;
    border-top: 1px solid #1a2130;
    padding: 10px 22px;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  footer .phase { font-size: 12.5px; color: #e6e9ef; }
  footer .phase .spin { display: inline-block; animation: spin 1s linear infinite; }
  footer .tail {
    font-size: 11px;
    color: #5c6579;
    font-family: ui-monospace, Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  footer .err { color: #ff9a9a; }
  footer .ok { color: #7fd4a8; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <h1>插件中心</h1>
    <span class="engine" id="engine"></span>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="searchbar" id="searchbar" hidden>
    <input id="q" placeholder="搜索 dsh 插件(名称 / 关键词 / 作者)…" />
    <button id="search">搜索</button>
  </div>
  <main id="main" hidden>
    <h2>搜索结果</h2>
    <div id="results"><div class="empty">输入关键词开始搜索;结果来自 npm 生态(仅含声明 dsh-plugin 的包)。</div></div>
    <h2>已安装</h2>
    <div id="installed"><div class="empty">读取中…</div></div>
    <div class="empty" style="margin-top:10px">
      「已启用」表示插件已加入引擎组合树;运行状态以引擎内「设置 → 插件」为权威。
    </div>
  </main>
  <footer>
    <div class="phase" id="phase"></div>
    <div class="tail" id="tail"></div>
  </footer>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;

  function setBusy(b) {
    busy = b;
    for (const btn of document.querySelectorAll('button')) btn.disabled = b;
    if (!b) refreshInstalled();
  }

  function phase(text, cls) {
    $('phase').className = 'phase ' + (cls || '');
    $('phase').innerHTML = text
      ? (cls === 'err' ? '✕ ' : cls === 'ok' ? '✓ ' : '<span class="spin">⠋</span> ') + text
      : '';
  }

  function tailLine(text) {
    if (!text) return;
    const lines = text.split('\n').filter(Boolean);
    $('tail').textContent = lines[lines.length - 1] || '';
  }

  window.dshDesktop.onPluginEvent((ev) => {
    if (ev.type === 'phase') phase(ev.text);
    if (ev.type === 'output') tailLine(ev.text);
    if (ev.type === 'done') {
      if (ev.ok) {
        phase(`${ev.name} ${ev.kind === 'install' ? '安装完成' : ev.kind === 'uninstall' ? '已卸载' : '已' + (ev.enabled ? '启用' : '禁用')}`, 'ok');
        setTimeout(() => phase(''), 4000);
      } else {
        phase(`${ev.name} 操作失败:${ev.error}`, 'err');
      }
      setBusy(false);
      if (ev.ok) doSearch();
    }
  });

  function card({ title, ver, desc, meta, badge, badgeOff, actions }) {
    const el = document.createElement('div');
    el.className = 'card';
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `
      <div class="title"></div>
      <div class="desc"></div>
      <div class="meta"></div>`;
    info.querySelector('.title').append(title);
    if (ver) info.querySelector('.title').insertAdjacentHTML('beforeend', `<span class="ver"></span>`);
    if (ver) info.querySelector('.ver').textContent = ver;
    info.querySelector('.desc').textContent = desc || '';
    info.querySelector('.meta').textContent = meta || '';
    el.append(info);
    if (badge) {
      const b = document.createElement('span');
      b.className = 'badge' + (badgeOff ? ' off' : '');
      b.textContent = badge;
      el.append(b);
    }
    for (const a of actions || []) {
      const btn = document.createElement('button');
      btn.className = 'act ' + (a.primary ? 'primary' : '') + (a.danger ? 'danger' : '');
      btn.textContent = a.label;
      btn.onclick = a.onclick;
      el.append(btn);
    }
    return el;
  }

  async function init() {
    const cap = await window.dshDesktop.pluginCapability();
    if (!cap) {
      $('notice').hidden = false;
      $('notice').textContent = '当前引擎不支持插件管理(插件中心需要 dsh 引擎)。';
      phase('当前引擎不支持插件管理', 'err');
      return;
    }
    $('engine').textContent = cap.engine;
    const state = await window.dshDesktop.pluginListInstalled();
    if (!state.initialized) {
      $('notice').hidden = false;
      $('notice').textContent = '引擎尚未初始化插件目录——先正常启动一次引擎,再回来安装插件。';
    }
    $('searchbar').hidden = false;
    $('main').hidden = false;
    refreshInstalled();
    $('q').focus();
  }

  async function refreshInstalled() {
    const state = await window.dshDesktop.pluginListInstalled();
    const box = $('installed');
    box.innerHTML = '';
    if (!state.plugins.length) {
      box.innerHTML = '<div class="empty">还没有安装任何插件。</div>';
      return;
    }
    for (const p of state.plugins) {
      box.append(card({
        title: p.name,
        ver: p.version,
        desc: '',
        meta: '',
        badge: p.enabled ? '已启用' : '已安装',
        badgeOff: !p.enabled,
        actions: [
          { label: p.enabled ? '禁用' : '启用', onclick: () => run(() => window.dshDesktop.pluginSetEnabled(p.name, !p.enabled)) },
          { label: '卸载', danger: true, onclick: () => {
              if (confirm(`确定卸载 ${p.name} 吗?(插件自身的配置数据会保留)`))
                run(() => window.dshDesktop.pluginUninstall(p.name));
            } },
        ],
      }));
    }
  }

  async function doSearch() {
    if (busy) return;
    const q = $('q').value.trim();
    if (!q) return;
    phase(`搜索“${q}”…`);
    $('search').disabled = true;
    try {
      const { results, total } = await window.dshDesktop.pluginSearch(q);
      const box = $('results');
      box.innerHTML = '';
      if (!results.length) {
        box.innerHTML = `<div class="empty">没有找到匹配的插件(npm 生态共 ${total} 个 dsh-plugin 包)。</div>`;
      }
      for (const r of results.slice(0, 15)) {
        const meta = [r.publisher, r.date ? r.date.slice(0, 10) : '', r.downloads ? `↓${r.downloads}/月` : ''].filter(Boolean).join(' · ');
        box.append(card({
          title: r.name,
          ver: r.version,
          desc: r.description,
          meta,
          badge: r.installed === 'enabled' ? '已启用' : r.installed === 'installed' ? '已安装' : '',
          badgeOff: r.installed === 'installed',
          actions: r.installed === 'none'
            ? [{ label: '安装', primary: true, onclick: () => run(() => window.dshDesktop.pluginInstall(r.name, r.version)) }]
            : [],
        }));
      }
      phase('');
    } catch (e) {
      phase(`搜索失败:${e.message}`, 'err');
    } finally {
      $('search').disabled = false;
    }
  }

  async function run(fn) {
    if (busy) return;
    setBusy(true);
    phase('准备中…');
    try {
      await fn();
    } catch (e) {
      phase(`操作失败:${e.message}`, 'err');
      setBusy(false);
    }
  }

  $('search').onclick = doSearch;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  init();
</script>
</body>
</html>
