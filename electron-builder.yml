appId: com.dshdesktop.app
productName: DSH Desktop
directories:
  output: release
  buildResources: build
files:
  - src/**
  - dev-engines/**
  - package.json
# 自动更新发布源(electron-updater 据此查找最新版本)
publish:
  provider: github
  owner: ItsDalk-Lane
  repo: dsh-desktop
# 全平台图标:mac 用 icns,win 用 ico,linux 用 icons/ 下的 png(按尺寸)
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    # zip 供 electron-updater 增量更新用(latest-mac.yml 指向 zip)
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target: nsis
linux:
  icon: build/icons
  target: AppImage
